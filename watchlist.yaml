# Seed configuration for the radar.
#
# Discovery is creator-seeded rather than global-search, because ShopMy's
# product search endpoints require authentication (verified 401) and we do not
# bypass auth. See PROBE_LOG.md.
#
# Choosing which creators matter is the human-in-the-loop step: it is where
# judgment genuinely beats automation, and it is the stage the role description
# explicitly asks for. Everything downstream of this list is automated.

creators:
  # Handle              # Who they are                  # last activity seen when seeded
  - dressforthewedding  # Dress for the Wedding          2026-06-22
  - jamieschuppert      # Jamie Schuppert                2026-05-27
  - lexxhidalgo         # Lexi Hidalgo                   2026-04-30
  - hdillz11            # Heather DiLorenzo              2026-03-23
  - curatedbymc         # CURATEDbyMC                    2026-03-03
  - ladydianamay        # Diana-May                      2026-02-03
  - jenniferatilemile   # Jennifer Atilemile
  - lucycassels         # Lucy Cassels
  - brooklynandbailey   # Brooklyn and Bailey

# Only this category is scored. ShopMy taxonomy: Dresses = category id 192,
# Department_id 44 (verified against /api/Categories/).
category_filter: Dresses

# ---------------------------------------------------------------------------
# Targeting, per the founder's written clarifications (2026-08-22). Quoted so the reasoning
# behind these numbers stays attached to them.
# ---------------------------------------------------------------------------

# "There is not a strict price or brand cutoff, but I would focus on
#  contemporary-to-premium occasionwear, roughly $400 to $1,000. The key is that
#  the item is expensive enough for its potential rental or resale value to
#  meaningfully influence someone's decision to purchase it."
#
# Implemented as a soft ranking factor, not a hard filter, because she said it is
# not a strict cutoff. The taper is deliberately asymmetric: below the band the
# presale mechanic breaks down (a $100 dress's resale value does not change
# anyone's purchase decision), while above it the mechanic still holds and the
# item is merely pricier than her stated focus.
price_band:
  min: 400
  max: 1000
  below_falloff: 250   # dollars below `min` at which fit reaches zero
  above_falloff: 1500  # dollars above `max` at which fit reaches zero

# "I would focus primarily on occasionwear, particularly wedding guest and event
#  dressing. I would not completely exclude going-out or vacation dresses if the
#  signals are especially strong."
#
# Occasion is inferred from the collection a creator filed the item under, then
# weighted rather than filtered, so a strong going-out signal can still surface.
occasion_weights:
  occasion: 1.00       # wedding guest, formal, event, gala, black tie
  going_out: 0.70
  vacation: 0.60
  unknown: 0.80        # unlabeled collections are not penalized to zero

occasion_keywords:
  occasion:
    [wedding, bridal, bridesmaid, formal, gala, "black tie", event, cocktail,
     gown, engagement, rehearsal, guest]
  going_out:
    ["going out", party, club, night, birthday, bachelorette, "date night"]
  vacation:
    [vacation, resort, beach, honeymoon, cruise, tropical, "spring break"]

# Per creator, how many of their most-recently-updated collections to pull.
# Bounded to keep request volume polite; raise it for a wider sweep.
max_collections_per_creator: 12

# Ignore collections not touched in this many days. Stale collections still
# carry live click data, but they are weak evidence of *current* creator push.
collection_staleness_days: 400

# Google Trends cross-check terms. Kept small because the endpoint is
# unofficial and rate-limits aggressively.
trend_terms:
  - wedding guest dress
  - maxi dress
  - formal dress

# Brands to check for secondary-market supply on Poshmark. Populated from
# whatever the demand side surfaces; these are the ones seen so far.
supply_brands:
  - MESHKI
  - Retrofete
  - House of CB

# Polite request pacing, in seconds.
request_delay: 0.7
