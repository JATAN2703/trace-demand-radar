      it under. TikTok suggests that tag is wrong for this brand.

      This is direct evidence for the limitation already noted in the code:
      collection-name occasion inference is noisy, because it reflects one
      curator's framing rather than the product's actual cultural positioning.
      A cross-check against platform content would improve it.

      Implication for TRACE: Porter Midi is the weakest of the three finalists.
      Click momentum without creator corroboration, no product-level attention,
      and a probable occasion mismatch. Worth reporting precisely because the
      radar ranked it #4 and the manual check demotes it. That is the
      human-in-the-loop step doing its job.

