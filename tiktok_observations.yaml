# TikTok observations (manual, human-in-the-loop).
#
# TikTok is the attention layer: it shows what creators are putting in front of
# consumers. It is also the one source with no usable programmatic access, and
# the brief says so ("TikTok content is unstructured, and the exact product may
# not be named in the video"). So this is collected by hand and labeled as such.
#
# This is not a shortcut. Deciding which creators and which content matter is
# the judgment step the role description asks for, and it is the input that
# seeds everything the automated pipeline then does.
#
# RULES
#   * Record only what you actually saw, with the date you saw it.
#   * Never estimate a view count. Copy the number or leave it null.
#   * `null` means not observed. It is not zero.
#   * Paste the real video URL so every claim is checkable.

observed_at: 2026-08-23   # pass done ~15:40-16:15 ET, TikTok iOS app

# ---------------------------------------------------------------------------
# METHOD CAVEAT, and it limits what the dates below can support.
#
# All searches were run UNFILTERED on TikTok's "Top" tab, which ranks by
# engagement rather than by date. So the date spread recorded here is an artifact
# of that ranking, NOT a recency sample. High-engagement older posts surface;
# recent lower-engagement posts get buried beneath them.
#
# Consequence: the dates below establish that content EXISTS at those times. They
# do NOT establish that recent content is absent, and any claim of the form
# "attention is sustained rather than fresh" is under-evidenced by this method.
#
# Supporting hint that recent content is being outranked rather than missing: the
# Surya Garg post from 8 hours before the pass carried only 67 likes and still
# appeared in Top results.
#
# To measure recency properly, re-run with the date filter set to the last 7 days,
# or use the Videos tab sorted by recency. NOT DONE for this pass.
#
# Where trajectory is asserted in FINDINGS.md, it rests on the ShopMy click data
# (which is a genuine time series) rather than on these dates.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# PART 1 - Confirm the finalists (cross-platform breadth)
#
# For each dress the radar surfaced, does TikTok show creator attention too?
# A product strong on ShopMy AND visible on TikTok is a much better bet than one
# visible only in click data. Absence is also a finding: note it honestly.
# ---------------------------------------------------------------------------

