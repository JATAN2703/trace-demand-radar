    # -----------------------------------------------------------------------
    # SECOND PASS, date-filtered to "this week" (2026-08-23 18:40 ET).
    # Run specifically to fix the method caveat above: the first pass used the
    # engagement-ranked Top tab, which cannot support a recency claim.
    # Search returned exactly four posts and then "No more results", so this is
    # a complete weekly set rather than a sample.
    # -----------------------------------------------------------------------
    filtered_week_pass:
      total_posts_this_week: 4
      complete_set: true          # "No more results" shown
      ano_posts: 2
      posts:
        - creator: "Anne Leopard"
          posted: "5h ago"
          likes: 87
          caption: "MY TOP FAVORITE niche and fun fall wedding g[uest dresses]"
          overlay_text: "Unique & chic fall wedding guest dresses"
          shows_ano: true
          note: >
            The most valuable single post in either pass. A curated FALL WEDDING
            GUEST roundup, posted five hours before the search, in which the Ano
            appears among a shortlist of options. This is a second, independent,
            and current editorial framing of the Ano as wedding-guest wear, and it
            is stronger than the April listicle because the Ano is being SELECTED
            against alternatives rather than merely listed.
        - creator: "Surya Garg"
          posted: "10h ago"
          likes: 70
          caption: "@kilentar let's get married potentially the [greatest dress I will ever wear]"
          shows_ano: true
        - creator: "Lauren Wolfe"
          posted: "1d ago"
          likes: 2900
          verified: true
          caption: "how do people even think to design a dress..."
          shows_ano: false
          note: "Verified creator, highest engagement this week, but a different Kilentar piece (sheer beaded)."
        - creator: "S"
          posted: "4d ago"
          likes: 146
          caption: "OOTD Dress-@kilentar Shoes- Vinta[ge]"
          shows_ano: false

      what_this_settles: >
        Recency claim now MEASURED rather than inferred. Fresh Ano content exists:
        two of the four Kilentar posts this week feature it, at 5 and 10 hours old.

        But weekly volume is genuinely modest at four posts brand-wide. So the
        trajectory is steady-to-peaking, NOT a viral explosion, and it should be
        described that way. This independently agrees with the ShopMy click series
        classifying Ano `peaking` rather than `rising`, which is a real
        cross-source agreement on trajectory rather than a restatement.

      new_signal_fall_season: >
        NEW AND ACTIONABLE, not visible in the first pass.

        Anne Leopard's post is framed as "fall wedding guest dresses". Creators are
        already producing content for the FALL wedding season, and the Ano is
        appearing in it. That is forward-looking demand rather than a description
        of the current moment.

        For TRACE this is a timing argument. Fall wedding season has not happened
        yet, creators are pre-positioning for it now, and there is exactly one Ano
        available to rent in New York. Presale demand can be organized ahead of the
        season rather than chased during it, which is precisely the window the
        presale model is supposed to exploit.

    verdict: "present, product-level, correctly occasion-tagged, fresh content confirmed"
    note: >
      This is the strongest case of the three finalists, and it displaces Cora as
      the lead finding.

      All four signals line up, which is not true of the other two:

      1. PRODUCT identified by name, not just brand. An editorial listicle names
         "Kilentar - Ano Dress" and describes the four tiers of fringe. Visual
         match to the sunshine-yellow fringe dress across at least five videos.
      2. OCCASION independently confirmed. Tagged #weddingguestdress by two
         separate creators, styled with a partner in a suit, and placed in a
         listicle about wedding-guest outfits. Our pipeline tagged it `occasion`
         from a collection name; TikTok agrees. Contrast ALEMAIS, where the same
         inference was wrong.
      3. LIVE. A post 8 hours before this pass, alongside sustained engagement
         from April to June (13.4K, 7.7K, 5.1K, 2.1K).
      4. PRICE in band at $750, unlike Cora at $360.

      And the supply side is where it becomes a TRACE opportunity rather than
      just a trend: Poshmark showed only 5 listings for the entire brand
      (below page size, so a genuine count, not a saturated one). Real
      product-level demand, wedding-guest positioning, in-band price, and almost
      no secondary supply.

      RECENCY, stated precisely because it matters and is easy to overstate:

        Ano-dress-specific evidence:  Apr 21, Apr 24, Jun 20, Jun 21, Jun 23,
                                      Jun 27, and one post 8h before this pass.
        Other Kilentar products:      Oct 13 2024, Sep 25 2025, Aug 24 2025,
                                      Feb 10 (rainbow "Mami"/scale dress, and the
                                      rental post).

      So the bulk of Ano evidence is two to four months old, with a single post in
      the last day. This is sustained attention, NOT a fresh explosion, and it
      should not be described as one. It matches the radar classifying Ano
      `peaking` rather than `rising`, so the two sources agree on trajectory as
      well as existence. It is not the 10x spike Cora is.

      The genuinely old posts (Oct 2024 onward) are DIFFERENT products and must
      not be read as Ano momentum. What they do establish is separate and useful:
      Kilentar has held creator attention across roughly two years. For a presale
      marketplace that matters on its own terms, because Ella's criterion is that
      an item be "expensive enough for its potential rental or resale value to
      meaningfully influence someone's decision to purchase it." Durable brand
      appeal makes that resale value credible in a way a three-week flash trend
      does not. A dress that is hot this month and forgotten next month is a poor
      presale bet even if its momentum score is high today.

      Also note the brand account has 100.3K followers but its own posts get
      60-112 likes, while creator posts reach 5-13K. Reach here is creator-driven,
      which is directly relevant to Ella's stated action of recruiting the
      creators already driving discovery.

