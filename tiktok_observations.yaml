    comment_intent_finding: >
      HONEST GAP FIRST: no comment in this thread expressed rental or
      buy-secondhand intent. Nobody said "does anyone want to sell theirs" or
      "wish I could rent this." Claiming otherwise would be overclaiming, so the
      rental-demand hypothesis is unsupported by this evidence.

      What IS present is primary purchase intent: two explicit "where is this
      from" requests, and a top comment at 3,651 likes about the garment itself.

      And on reflection that is the more useful signal for TRACE, not a weaker
      one. TRACE is a PRESALE marketplace: the listing is created before or at
      the point of purchase. So the person who matters is the one about to buy,
      not the one hunting a secondhand unit. Ella named this action explicitly:
      "identify people who already own or are considering purchasing it as
      potential listers."

      A commenter asking where a $360 dress is from, on a post tagged
      #weddingguestlook, is a candidate lister at the exact moment TRACE would
      want to reach them. The comment thread is therefore a supply-acquisition
      channel, not just a demand indicator, and it is directly observable at
      product level.

      Caveat on scale: six comments from one post is illustrative, not
      quantitative. The pattern would need sampling across posts before anyone
      sized it.

    verdict: "present, strongly"
    note: >
      Cross-platform confirmation of the radar's top momentum signal, from an
      entirely independent source. The radar flagged Cora on published click data
      (378 -> 3,653 daily, ~10x in one publish); TikTok independently shows 100+
      posts, at least 11 distinct creators, and videos posted 47 minutes and 1
      hour before this pass. Two unrelated signals agreeing is much stronger
      evidence than either alone.

      Recency spread observed: 47m, 1h, 1d, 2d, 5d, 5d, 6d, and 8-15. This is a
      live trend, not a retrospective one.

      Saves-to-likes ratios are notably high (Angel Song 4,496 saves on 58K
      likes; Eliza 355 on 2,703). A save is closer to purchase intent than a
      like, since people bookmark what they intend to buy or find later.

      Honest caveat on targeting: at $360 Cora sits just below Ella's stated
      $400-1,000 band (price_fit 0.84 in the model). She said the band is not a
      strict cutoff and that she would not exclude strong signals, so this is
      defensible, but it should be stated rather than glossed.

    dupe_signal:
      observed: true
      evidence:
        - "courtney, 5d ago, 136 likes: 'Realisation P@r lookalike dress - The Cora'"
        - "courtney, 1d ago, 16 likes: 'You absolutely need this Realisation p@r Cora l[ookalike]'"
        - "Brand name deliberately obfuscated as 'P@r' / 'p@r' in captions"
      why_it_matters: >
        This is the most commercially interesting thing in the whole pass, and it
        is a signal TRACE could act on that no click-count would reveal.

        Dupe and lookalike content only appears once demand outstrips what people
        can actually get or afford. Creators making "lookalike" videos with
        TikTok Shop tags are monetising an audience that wants this specific
        dress and is not buying the original. That is a demand-supply gap
        expressed in consumer behaviour rather than inferred from listing counts.

        For a presale marketplace this is close to an ideal condition: provable
        want, constrained access, and a price point where resale or rental value
        plausibly changes the purchase decision. It also suggests the population
        TRACE wants is already visible and reachable, sitting in the comments of
        dupe videos.

        The obfuscated spelling ("P@r") is a secondary tell: creators evade brand
        detection when content is organic and high-volume enough to be worth
        policing.

