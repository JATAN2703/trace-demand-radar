name: Daily demand radar

# Momentum is a derivative, so the system needs history it collected itself.
# This runs every morning, appends one snapshot, and commits it back to the repo
# so the stored series is auditable rather than asserted.
on:
  schedule:
    # Right-sized from 4x/day to 2x/day after measuring the source (see
    # eval/counter_cadence.py). ShopMy republishes its click counters as a
    # once-daily batch: across five snapshots spanning 23:27-07:27 UTC, zero of
    # 525 products changed; at 13:27 UTC, 248 of 526 changed at once. So the
    # three extra daily polls were fetching an identical payload.
    #
    # Two runs rather than one because the publish window is only bracketed to
    # 07:27-13:27 UTC, a six-hour uncertainty. 14:00 catches the publish on
    # schedule; 20:00 catches it if it drifts later, so a drift costs us hours
    # rather than a whole day. Halves API load against the previous schedule for
    # no information loss.
    - cron: "0 14,20 * * *"   # 14:00 and 20:00 UTC, bracketing the observed publish
  workflow_dispatch:              # manual trigger for demos

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run radar
        # Collectors fail soft, so a single unreachable source should not fail
        # the run. The digest reports which sources were unavailable.
        run: python run.py

      - name: Commit snapshot
        # The push must survive the remote having moved on since checkout, which
        # happens whenever a commit lands mid-run. A plain push fails with
        # "fetch first" and, because the runner is ephemeral, that silently loses
        # the whole snapshot.
        #
        # `reset --soft` onto the fetched tip is used instead of pull/rebase
        # because data/radar.sqlite is a binary file: a rebase can conflict on it
        # and there is no sane textual resolution. Soft-resetting keeps the
        # working tree (which already holds this run's database, built from the
        # remote state at checkout plus this run's append) and simply replays it
        # on top of the new tip, so a conflict is not possible.
        #
        # This makes CI the single writer of the database, which is deliberate:
        # local runs should not commit it.
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --soft origin/main
            # Stage only our own outputs. Never `add -A`: after the soft reset,
            # files added to the remote by other commits would otherwise be
            # staged as deletions.
            git add data/radar.sqlite reports/
            if git diff --staged --quiet; then
              echo "No change to commit."
              exit 0
            fi
            git commit -m "radar: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}), retrying against new tip"
            sleep $((attempt * 5))
          done
          echo "::error::snapshot could not be pushed after 3 attempts"
          exit 1

      - name: Surface the digest in the run summary
        run: cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
