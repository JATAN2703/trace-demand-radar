name: Daily demand radar

# Momentum is a derivative, so the system needs history it collected itself.
# This runs every morning, appends one snapshot, and commits it back to the repo
# so the stored series is auditable rather than asserted.
on:
  schedule:
    # Every 6 hours. Four snapshots a day rather than one buys lower detection
    # latency, and it also lets us establish empirically whether the upstream
    # `dailyClicks` counter is a rolling trailing-24h window or a same-day
    # accumulator. Alerting is anchored to a ~24h-old baseline either way (see
    # store.baseline_run), so polling frequency is a latency choice and not a
    # correctness risk.
    #
    # Not more often than this on purpose: each run makes roughly 120 requests
    # to a third-party API, so 6-hourly stays a respectful ~480/day, and it
    # keeps the job comfortably inside the free Actions minutes for a private
    # repo (~360 min/month).
    - cron: "0 1,7,13,19 * * *"   # 01/07/13/19 UTC; the 13:00 run is ~9am ET
  workflow_dispatch:              # manual trigger for demos

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run radar
        # Collectors fail soft, so a single unreachable source should not fail
        # the run. The digest reports which sources were unavailable.
        run: python run.py

      - name: Commit snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/radar.sqlite reports/
          if git diff --staged --quiet; then
            echo "No change to commit."
          else
            git commit -m "radar: snapshot $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Surface the digest in the run summary
        run: cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
