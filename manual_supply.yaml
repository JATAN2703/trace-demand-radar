# Manual supply observations (human-in-the-loop).
#
# Automated supply is inconclusive: Poshmark page one saturates at 48 listings
# for every brand and a true total needs the robots-disallowed /search path;
# Pickle is behind a Vercel bot gate returning 429 on every host, including its
# own robots.txt. See PROBE_LOG.md and collectors/poshmark.py.
#
# So supply for finalist products is measured by hand. That is tractable because
# the brief asks about two or three dresses, and it keeps the number honest.
#
# Rules for filling this in:
#   * Record what you actually saw, with the date you saw it.
#   * `null` means not checked. It is NOT zero. The scorer treats null as
#     neutral supply so an unchecked item cannot look like a confirmed gap.
#   * A Pickle listing that has disappeared is ambiguous: rented, sold, removed
#     or deactivated are indistinguishable from outside. Use `ambiguous` notes
#     rather than inferring a rental.
#
# Schema per entry:
#   product_id:        ShopMy product id (preferred join key)
#   title / brand:     for human readability
#   poshmark_listings: integer count of matching listings seen by hand, or null
#   pickle_listings:   integer count seen in the Pickle iOS app, or null
#   pickle_checked_at: ISO date of the app check
#   observed_at:       ISO date of the Poshmark check
#   confidence:        manual
#   note:              anything ambiguous or surprising

observations:
  - product_id: "2128245"
    title: "The Cora Dress"
    brand: "Réalisation Par"
    retail: 360
    poshmark_listings: 3
    pickle_listings: 22            # AT LEAST 22, still scrolling when counting stopped
    pickle_checked_at: 2026-08-23
    observed_at: 2026-08-23
    confidence: manual
    method: >
      poshmark.com search "Realisation Par - The Cora Dress", filtered to brand
      Réalisation Par + Women/Dresses. Scrolled roughly three screens of
      brand-filtered results; no further Cora listings appeared after the third.
      Counted only listings that are actually The Cora, in any print.
    listings_seen:
      - print: "Mirage stripe"
        price: 360
        size: "M"
        condition: "used"
        vs_retail: "at retail (100%)"
      - print: "Tortoiseshell"
        price: 400
        size: "L"
        condition: "NWT"
        vs_retail: "ABOVE retail (111%)"
      - print: "stripe"
        price: 295
        size: "XS"
        condition: "NWT"
        vs_retail: "below retail (82%)"
    note: >
      THE KEY FINDING IS PRICE RETENTION, NOT THE COUNT.

      Three Cora listings at $295, $360 and $400 against $360 retail, so a mean
      of roughly $352, about 98% of retail. Two of the three are New With Tags,
      i.e. bought and never worn. One is listed ABOVE retail.

      What makes this rigorous rather than anecdotal is the within-brand
      comparison, which controls for brand effects. Every other Réalisation Par
      dress on the same filtered results page is discounted hard:
        Iris silk    $125 from $325   (38%)
        Christy 90s  $129 from $249   (52%)
        Black mini   $120 from $200   (60%)
        Alba         $170 from $250   (68%)
        Elsa midi    $185 from $275   (67%)
        Gia midi     $275 from $310   (89%)
        Meg          $320 from $340   (94%)

      So the brand's catalogue typically resells at 38-94% of retail, while Cora
      holds at 82-111%. Cora is the only piece in the set retaining full value.

      Why this matters for TRACE specifically: Ella's stated criterion is that an
      item be "expensive enough for its potential rental or resale value to
      meaningfully influence someone's decision to purchase it." A dress that
      resells at or above what you paid makes listing it pre-purchase a rational
      financial decision rather than a gamble. This is the presale mechanic
      demonstrated with observed prices rather than asserted.

      Supply read: three units, two of them unworn, against 100+ TikTok posts and
      3,653 published daily clicks. Thin secondary supply against heavy demand.

      Caveats: asking prices, not sold prices, so this shows what sellers believe
      the market will bear, not confirmed transactions. Poshmark's sold-price
      history needs a login and was not used. Three listings is also a small
      sample; the within-brand contrast is what carries the argument, not the n.

    pickle_finding: >
      HYPOTHESIS OVERTURNED. Cora is NOT a demand-supply gap. It is the opposite.

      Pickle search "Realisation Par cora", brand-filtered, iOS app, 2026-08-23:
      at least 22 distinct Cora listings, and results were still scrolling when
      counting stopped. Rental prices $45-$100 against $360 retail, which is
      12-28% of retail and consistent with Pickle's own 10-20% guidance.

      Geography, recorded because TRACE is NYC-based and this is the relevant
      part: at least 12 of the listings are New York, spanning West Village,
      Greenwich Village x2, Chelsea x2, Gowanus x2, East Village x2, Lower East
      Side, Battery Park City, Murray Hill, Carnegie Hill. Plus Jersey City NJ.
      The rest are CA, IL, TN, PA, DC, CO.

      Listing-level demand on Pickle is also high: save counts of 434, 428, 288,
      286, 199, 187, 175, 153, 144, 135, 127 and so on. So this is an active
      rental market, not dormant inventory.

      One listing offers "Buy $360" alongside rent, i.e. resale at full retail on
      the rental platform.

      WHAT THIS MEANS FOR TRACE, stated plainly:

      Cora is the hottest item the radar found and simultaneously the WEAKEST
      presale candidate of the three. Demand is real and accelerating, but the
      secondary supply has already formed, and Pickle has already captured it in
      TRACE's own home market. Organising presale demand around Cora would mean
      competing with roughly a dozen existing NYC rental listings for the same
      dress.

      The brief anticipates exactly this test: "a dress that is accelerating on
      TikTok and being linked by multiple creators on ShopMy but has little
      presence on Pickle may represent an opportunity." Cora has heavy Pickle
      presence, so by that logic it is not the opportunity.

      WHY THIS MATTERS METHODOLOGICALLY: every automated signal pointed at Cora.
      10x click acceleration, 100+ TikTok posts, retail-price retention on
      Poshmark, two creators, correct occasion. On the automated evidence alone
      the recommendation would have been "concentrate on Cora", and it would have
      been wrong. A single manual check on the one platform that cannot be
      scraped reversed the conclusion.

      That is the strongest available argument for the human-in-the-loop design,
      and also a caution about the radar as built: it measures demand well and
      supply badly, so it will systematically over-rank items whose supply it
      cannot see. Recorded as a known limitation, not glossed.

    filter_caveat: >
      The search chip read "Local" while returning results from CA, IL, TN, DC
      and CO, so either the filter was not applied or "Local" denotes local
      delivery availability rather than a geographic restriction. Not resolved,
      so the NYC subset count is reported as observed rather than as a complete
      NYC inventory.

  - product_id: "1484885"
    title: "Ano Layered Raffia Dress"
    brand: "Kilentar"
    retail: 750
    poshmark_listings: 5           # brand-wide, from the automated collector
    pickle_listings: 3             # PRODUCT-level, and this one IS a total. See count_confidence.
    pickle_listings_nyc: 1         # the number that actually matters for TRACE
    pickle_brand_listings: 32      # brand-wide floor; brand scroll was stopped early
    pickle_checked_at: 2026-08-23
    pickle_ano_listings:
      - location: "Kips Bay, NY"
        size: "2"
        rent: 300
        pct_of_retail: 40
        saves: 135
        note: "The ONLY Ano rental unit in New York."
      - location: "Dallas, TX"
        size: "XS"
        rent: 240
        pct_of_retail: 32
        saves: 136
      - location: "Uptown, TX"
        size: "2"
        rent: 195
        pct_of_retail: 26
        saves: 2
      - location: "Woburn, MA"
        size: "S"
        rent: 250
        pct_of_retail: 33
        saves: 12
        note: >
          Titled "KILENTAR Yellow Fringe", found in the brand search not the
          product search. Visually the Ano, but not a titled match, so counted
          separately as probable rather than folded into the total.
    count_confidence: >
      RESOLVED, and the count is now reliable rather than a floor.

      Targeted product search "Kilentar Ano" in the Pickle iOS app returned three
      Ano listings, after which search relevance collapsed entirely into unrelated
      inventory (Norma Kamali, SNDYS denim, STAUD Albee, Retrofete, Cult Gaia,
      Zimmermann swimwear). The result set exhausted itself rather than being cut
      short by scrolling, which is what makes this a total and not a minimum.

      Three titled Ano listings, plus one probable fourth ("KILENTAR Yellow
      Fringe", Woburn MA) identified visually from the brand search.

      So: 3 confirmed, 4 including the probable, nationwide.
    observed_at: 2026-08-23
    confidence: manual
    method: >
      Pickle iOS app, search "Kilentar", scrolled roughly eight screens. Counted
      brand-wide listings and separately identified listings that are the Ano
      Layered Raffia specifically (sunshine yellow, tiered fringe).
    pickle_product_level:
      - title: "KÍLÈŃTÀR Ano Layered Raffi..."
        location: "Kips Bay, NY"
        size: "2"
        rent: 300
        saves: 135
        note: "Named explicitly. Rent is 40% of the $750 retail."
      - title: "KILENTAR Yellow Fringe..."
        location: "Woburn, MA"
        size: "S"
        rent: 250
        saves: 12
        note: "Titled differently but visually the Ano. Counted, flagged as an identification judgement."
    note: >
      SECOND HYPOTHESIS ALSO OVERTURNED, and the replacement is more useful.

      Kilentar is NOT absent from Pickle. Brand-wide there are roughly 32 listings
      across NY, CA, IL, FL, VA, WA, MA, GA, TX, NJ and MI, including Chelsea,
      Tribeca x3, Financial District x2, Greenwich Village, East Village, Crown
      Heights, Kips Bay, Central Harlem and Lawrence. One Mami listing has 2,000
      saves. So the brand has an established, active rental market.

      But the PRODUCT-level picture is completely different from Cora's, and that
      difference is the actual finding:

                          product-level Pickle    rent as % of retail
        Cora  ($360)      22+ listings            $45-100   = 12-28%
        Ano   ($750)      2 listings              $250-300  = 33-40%

      Two things follow.

      First, Ano's supply is genuinely thin at the product level even though its
      brand is well represented. Cora has an order of magnitude more units of the
      same dress available to rent.

      Second, and more telling: Ano rents at 26-40% of retail against Cora's
      12-28%, and against Pickle's own published guidance of 10-20%. A rental
      price that far above the platform norm is what scarcity looks like in
      pricing. Owners are able to charge it because demand exceeds the three
      available units.

      THIRD, AND THIS IS THE SHARPEST VERSION OF THE FINDING. Geography.

        Nationwide Ano rental units:      3 (4 including the probable Woburn one)
        Ano rental units in NEW YORK:     1
        Cora rental units in NEW YORK:    ~12

      TRACE is New York based, and Pickle is peer-to-peer with local delivery, so
      local supply is what actually competes. There is exactly ONE Ano available
      to rent in New York, against roughly twelve Coras.

      And the NYC unit is the most expensive of the three ($300, 40% of retail,
      versus $240 in Dallas and $195 in Uptown TX). The highest price sits in the
      highest-demand market on the only local unit. That is textbook scarcity
      pricing, and it is observed rather than modelled.

      Demand pressure against those few units is also visible: the Dallas listing
      has 136 saves and the Kips Bay listing 135, on a product with three units in
      existence on the platform.

      So the defensible claim is not "Kilentar is untapped". It is: proven brand
      rental economics, thin product-level supply, and rental pricing well above
      platform norms, on an in-band $750 occasionwear piece with wedding-guest
      positioning confirmed independently on TikTok.

    brand_vs_product_finding: >
      THE METHODOLOGICAL LESSON, which belongs in the write-up:

      Brand-level supply and product-level supply lead to opposite conclusions
      here. Brand-level, Kilentar looks well supplied (32 Pickle listings) and
      Cora looks scarce (Réalisation Par has fewer). Product-level, it inverts
      completely: Cora has 22+ units, Ano has 2.

      The radar as built can only reach brand-level supply, and only on Poshmark,
      where page one saturates at 48 and the count is useless anyway. So the
      system is structurally unable to see the distinction that actually decides
      the recommendation. Both hypotheses it generated were overturned by manual
      product-level checks.

      That is not a reason to distrust the demand side, which performed well and
      was corroborated three independent ways. It is a precise statement of where
      the automation ends and why the human step is not decoration.

    cross_platform_note: >
      Kilentar shows ~32 Pickle rental listings against 5 Poshmark resale
      listings. Réalisation Par shows the reverse pattern relative to its
      resale presence. Tentative reading: Kilentar is a rent-not-resell brand,
      which is consistent with statement occasionwear that gets worn once. Also
      visible are high Pickle buy-out prices for Kilentar (a Starfish at $1,000,
      one at $750, a Mami at $650, another at $500), so the pieces hold value.
      Both observations support the presale mechanic on this brand, though with
      n this small they are directional rather than established.

