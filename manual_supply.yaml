# Manual supply observations (human-in-the-loop).
#
# Automated supply is inconclusive: Poshmark page one saturates at 48 listings
# for every brand and a true total needs the robots-disallowed /search path;
# Pickle is behind a Vercel bot gate returning 429 on every host, including its
# own robots.txt. See PROBE_LOG.md and collectors/poshmark.py.
#
# So supply for finalist products is measured by hand. That is tractable because
# the brief asks about two or three dresses, and it keeps the number honest.
#
# Rules for filling this in:
#   * Record what you actually saw, with the date you saw it.
#   * `null` means not checked. It is NOT zero. The scorer treats null as
#     neutral supply so an unchecked item cannot look like a confirmed gap.
#   * A Pickle listing that has disappeared is ambiguous: rented, sold, removed
#     or deactivated are indistinguishable from outside. Use `ambiguous` notes
#     rather than inferring a rental.
#
# Schema per entry:
#   product_id:        ShopMy product id (preferred join key)
#   title / brand:     for human readability
#   poshmark_listings: integer count of matching listings seen by hand, or null
#   pickle_listings:   integer count seen in the Pickle iOS app, or null
#   pickle_checked_at: ISO date of the app check
#   observed_at:       ISO date of the Poshmark check
#   confidence:        manual
#   note:              anything ambiguous or surprising

observations:
  - product_id: "2128245"
    title: "The Cora Dress"
    brand: "Réalisation Par"
    retail: 360
    poshmark_listings: 3
    pickle_listings: 22            # AT LEAST 22, still scrolling when counting stopped
    pickle_checked_at: 2026-08-23
    observed_at: 2026-08-23
    confidence: manual
    method: >
      poshmark.com search "Realisation Par - The Cora Dress", filtered to brand
      Réalisation Par + Women/Dresses. Scrolled roughly three screens of
      brand-filtered results; no further Cora listings appeared after the third.
      Counted only listings that are actually The Cora, in any print.
    listings_seen:
      - print: "Mirage stripe"
        price: 360
        size: "M"
        condition: "used"
        vs_retail: "at retail (100%)"
      - print: "Tortoiseshell"
        price: 400
        size: "L"
        condition: "NWT"
        vs_retail: "ABOVE retail (111%)"
      - print: "stripe"
        price: 295
        size: "XS"
        condition: "NWT"
        vs_retail: "below retail (82%)"
    note: >
      THE KEY FINDING IS PRICE RETENTION, NOT THE COUNT.

      Three Cora listings at $295, $360 and $400 against $360 retail, so a mean
      of roughly $352, about 98% of retail. Two of the three are New With Tags,
      i.e. bought and never worn. One is listed ABOVE retail.

      What makes this rigorous rather than anecdotal is the within-brand
      comparison, which controls for brand effects. Every other Réalisation Par
      dress on the same filtered results page is discounted hard:
        Iris silk    $125 from $325   (38%)
        Christy 90s  $129 from $249   (52%)
        Black mini   $120 from $200   (60%)
        Alba         $170 from $250   (68%)
        Elsa midi    $185 from $275   (67%)
        Gia midi     $275 from $310   (89%)
        Meg          $320 from $340   (94%)

      So the brand's catalogue typically resells at 38-94% of retail, while Cora
      holds at 82-111%. Cora is the only piece in the set retaining full value.

      Why this matters for TRACE specifically: Ella's stated criterion is that an
      item be "expensive enough for its potential rental or resale value to
      meaningfully influence someone's decision to purchase it." A dress that
      resells at or above what you paid makes listing it pre-purchase a rational
      financial decision rather than a gamble. This is the presale mechanic
      demonstrated with observed prices rather than asserted.

      Supply read: three units, two of them unworn, against 100+ TikTok posts and
      3,653 published daily clicks. Thin secondary supply against heavy demand.

      Caveats: asking prices, not sold prices, so this shows what sellers believe
      the market will bear, not confirmed transactions. Poshmark's sold-price
      history needs a login and was not used. Three listings is also a small
      sample; the within-brand contrast is what carries the argument, not the n.

    pickle_finding: >
      HYPOTHESIS OVERTURNED. Cora is NOT a demand-supply gap. It is the opposite.

      Pickle search "Realisation Par cora", brand-filtered, iOS app, 2026-08-23:
      at least 22 distinct Cora listings, and results were still scrolling when
      counting stopped. Rental prices $45-$100 against $360 retail, which is
      12-28% of retail and consistent with Pickle's own 10-20% guidance.

      Geography, recorded because TRACE is NYC-based and this is the relevant
      part: at least 12 of the listings are New York, spanning West Village,
      Greenwich Village x2, Chelsea x2, Gowanus x2, East Village x2, Lower East
      Side, Battery Park City, Murray Hill, Carnegie Hill. Plus Jersey City NJ.
      The rest are CA, IL, TN, PA, DC, CO.

      Listing-level demand on Pickle is also high: save counts of 434, 428, 288,
      286, 199, 187, 175, 153, 144, 135, 127 and so on. So this is an active
      rental market, not dormant inventory.

      One listing offers "Buy $360" alongside rent, i.e. resale at full retail on
      the rental platform.

      WHAT THIS MEANS FOR TRACE, stated plainly:

      Cora is the hottest item the radar found and simultaneously the WEAKEST
      presale candidate of the three. Demand is real and accelerating, but the
      secondary supply has already formed, and Pickle has already captured it in
      TRACE's own home market. Organising presale demand around Cora would mean
      competing with roughly a dozen existing NYC rental listings for the same
      dress.

      The brief anticipates exactly this test: "a dress that is accelerating on
      TikTok and being linked by multiple creators on ShopMy but has little
      presence on Pickle may represent an opportunity." Cora has heavy Pickle
      presence, so by that logic it is not the opportunity.

      WHY THIS MATTERS METHODOLOGICALLY: every automated signal pointed at Cora.
      10x click acceleration, 100+ TikTok posts, retail-price retention on
      Poshmark, two creators, correct occasion. On the automated evidence alone
      the recommendation would have been "concentrate on Cora", and it would have
      been wrong. A single manual check on the one platform that cannot be
      scraped reversed the conclusion.

      That is the strongest available argument for the human-in-the-loop design,
      and also a caution about the radar as built: it measures demand well and
      supply badly, so it will systematically over-rank items whose supply it
      cannot see. Recorded as a known limitation, not glossed.

    filter_caveat: >
      The search chip read "Local" while returning results from CA, IL, TN, DC
      and CO, so either the filter was not applied or "Local" denotes local
      delivery availability rather than a geographic restriction. Not resolved,
      so the NYC subset count is reported as observed rather than as a complete
      NYC inventory.

